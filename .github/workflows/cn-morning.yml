name: CN Morning Check

on:
  schedule:
    # 07:15 Shanghai = 23:15 UTC-1day (Sun-Thu for Mon-Fri mornings).
    # Runs the same-day scan and sends the pre-open Telegram watchlist.
    - cron: "15 23 * * 0-4"
    # 09:35 Shanghai = 01:35 UTC (weekdays).
    # Reuses the same-day watchlist and sends GO/CANCEL using live open prices.
    - cron: "35 1 * * 1-5"
    # Northbound source-lag probes: 12:00, 15:30, 17:00 Shanghai.
    - cron: "0 4 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "preopen_scan/open_check/northbound paper modes"
        required: true
        default: "preopen_scan"
        type: choice
        options:
          - preopen_scan
          - open_check
          - northbound_paper_preopen
          - northbound_paper_open_check

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  TZ: "Asia/Shanghai"

concurrency:
  group: cn-morning-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  preopen-scan:
    name: 07:15 Same-Day Pre-Open Scan
    if: github.event.schedule == '15 23 * * 0-4' || inputs.mode == 'preopen_scan'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute trading date
        id: date
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "Trading date: ${TRADE_DATE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CN provider smoke test
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/smoke_cn_provider.py --config config/default.yaml

      - name: Run same-day scan and send Telegram
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          python main.py scan --config config/default.yaml --date "${{ steps.date.outputs.trade_date }}"

      - name: Verify same-day watchlist artifact
        run: |
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          WL_FILE="outputs/${TRADE_DATE}/execution_watchlist_${TRADE_DATE}.json"
          if [ ! -f "${WL_FILE}" ]; then
            echo "ERROR: execution_watchlist not generated for ${TRADE_DATE}"
            exit 1
          fi
          echo "Watchlist artifact verified: ${WL_FILE}"
          python -m json.tool "${WL_FILE}" | head -30

      - name: Commit same-day pre-open outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}" data/bad_tickers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No same-day pre-open outputs to commit"
          else
            git commit -m "auto: CN pre-open outputs for ${TRADE_DATE}"
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push failed (attempt $i/3), rebasing..."
              git stash push --include-untracked --message "cn-preopen-rebase-${i}" || true
              git fetch origin main
              git rebase origin/main
              git stash pop || true
            done
            if [ "${pushed}" != "true" ]; then
              echo "Failed to push CN pre-open outputs after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload same-day pre-open outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-preopen-outputs
          path: outputs/**
          retention-days: 7

  northbound-paper-preopen:
    name: 07:15 Northbound Paper Feed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Deliberately independent of the 240-min Dragon Pulse scan. This paper
    # feed only needs hsgt_top10 + OHLCV and should not miss 09:35 if the full
    # live scan runs long.
    if: github.event.schedule == '15 23 * * 0-4' || inputs.mode == 'northbound_paper_preopen'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute trading date
        id: date
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run northbound paper feed
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          python scripts/northbound_paper_sleeve.py --mode preopen --date "${{ steps.date.outputs.trade_date }}"

      - name: Commit northbound paper outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}/northbound_paper_watchlist_${TRADE_DATE}.json" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/northbound_source_probe_${TRADE_DATE}.json" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.telegram_sent_"* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No northbound paper outputs to commit"
          else
            git commit -m "auto: northbound paper feed for ${TRADE_DATE}"
            git push origin HEAD:main || {
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            }
          fi

  northbound-source-probe:
    name: Northbound Source Timing Probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    if: github.event.schedule == '0 4 * * 1-5' || github.event.schedule == '30 7 * * 1-5' || github.event.schedule == '0 9 * * 1-5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute trading date
        id: date
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          PROBE_SLOT=$(TZ=Asia/Shanghai date +%H%M)
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "probe_slot=${PROBE_SLOT}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run northbound source probe
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/northbound_paper_sleeve.py --mode source_probe --date "${{ steps.date.outputs.trade_date }}"

      - name: Commit northbound source probe
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          PROBE_SLOT="${{ steps.date.outputs.probe_slot }}"
          SRC="outputs/${TRADE_DATE}/northbound_source_probe_${TRADE_DATE}.json"
          DEST="outputs/${TRADE_DATE}/northbound_source_probe_${TRADE_DATE}_${PROBE_SLOT}.json"
          if [ -f "${SRC}" ]; then cp "${SRC}" "${DEST}"; fi
          git add "${SRC}" "${DEST}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No northbound source probe outputs to commit"
          else
            git commit -m "auto: northbound source probe for ${TRADE_DATE} ${PROBE_SLOT}"
            git push origin HEAD:main || {
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            }
          fi

  preflight:
    name: 09:35 Open GO/CANCEL Check
    if: github.event.schedule == '35 1 * * 1-5' || inputs.mode == 'open_check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull latest to get nightly outputs
          ref: main

      - name: Find latest watchlist
        id: check
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          WL_FILE="outputs/${TRADE_DATE}/execution_watchlist_${TRADE_DATE}.json"
          if [ -f "${WL_FILE}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
            echo "Same-day watchlist found: ${WL_FILE}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
            echo "ERROR: Missing same-day watchlist ${WL_FILE}. The 07:15 pre-open scan must finish and commit before the 09:35 open check."
            exit 1
          fi

      - name: Set up Python
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning check
        if: steps.check.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          TRADE_DATE="${{ steps.check.outputs.trade_date }}"
          python scripts/morning_check.py --date "${TRADE_DATE}"

      - name: Commit check results
        if: steps.check.outputs.found == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.check.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}/execution_check_${TRADE_DATE}.json" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.morning_alert_sent" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.morning_open_pending_sent" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No check results to commit"
          else
            git commit -m "auto: CN morning check for ${TRADE_DATE}"
            git push origin HEAD:main || {
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            }
          fi

  northbound-paper-open-check:
    name: 09:35 Northbound Paper Open Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    needs: [preflight]
    if: always() && (github.event.schedule == '35 1 * * 1-5' || inputs.mode == 'northbound_paper_open_check')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute trading date
        id: date
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run northbound paper open check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          python scripts/northbound_paper_sleeve.py --mode open_check --date "${TRADE_DATE}"

      - name: Commit northbound paper check outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}/northbound_paper_execution_check_${TRADE_DATE}.json" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.telegram_sent_"* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No northbound paper check outputs to commit"
          else
            git commit -m "auto: northbound paper open check for ${TRADE_DATE}"
            git push origin HEAD:main || {
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            }
          fi
