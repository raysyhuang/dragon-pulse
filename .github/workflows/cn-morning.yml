name: CN Morning Check

on:
  schedule:
    # 07:15 Shanghai = 23:15 UTC-1day (Sun-Thu for Mon-Fri mornings).
    # Runs the same-day scan and sends the pre-open Telegram watchlist.
    - cron: "15 23 * * 0-4"
    # 09:35 Shanghai = 01:35 UTC (weekdays).
    # Reuses the same-day watchlist and sends GO/CANCEL using live open prices.
    - cron: "35 1 * * 1-5"
    # 09:55 Shanghai backup for the open check. Retries when the 01:35 run is
    # lost to runner-acquisition failures or schedule delays; dedup markers
    # make a duplicate run a no-op.
    - cron: "55 1 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "preopen_scan/open_check"
        required: true
        default: "preopen_scan"
        type: choice
        options:
          - preopen_scan
          - open_check

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  TZ: "Asia/Shanghai"

concurrency:
  # The 01:35 and 01:55 UTC open-check crons share one group so the backup
  # run queues behind (never races) a still-running primary check.
  group: cn-morning-${{ (github.event.schedule == '35 1 * * 1-5' || github.event.schedule == '55 1 * * 1-5') && 'open-check' || github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  preopen-scan:
    name: 07:15 Same-Day Pre-Open Scan
    if: github.event.schedule == '15 23 * * 0-4' || inputs.mode == 'preopen_scan'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute trading date
        id: date
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "Trading date: ${TRADE_DATE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CN provider smoke test
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/smoke_cn_provider.py --config config/default.yaml

      - name: Run same-day scan and send Telegram
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          python main.py scan --config config/default.yaml --date "${{ steps.date.outputs.trade_date }}"

      - name: Verify same-day watchlist artifact
        run: |
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          WL_FILE="outputs/${TRADE_DATE}/execution_watchlist_${TRADE_DATE}.json"
          if [ ! -f "${WL_FILE}" ]; then
            echo "ERROR: execution_watchlist not generated for ${TRADE_DATE}"
            exit 1
          fi
          echo "Watchlist artifact verified: ${WL_FILE}"
          python -m json.tool "${WL_FILE}" | head -30

      - name: Commit same-day pre-open outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.date.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}" data/bad_tickers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No same-day pre-open outputs to commit"
          else
            git commit -m "auto: CN pre-open outputs for ${TRADE_DATE}"
            scripts/gha_push_with_rebase.sh main 3
          fi

      - name: Upload same-day pre-open outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-preopen-outputs
          path: outputs/**
          retention-days: 7

  preflight:
    name: 09:35 Open GO/CANCEL Check
    if: github.event.schedule == '35 1 * * 1-5' || github.event.schedule == '55 1 * * 1-5' || inputs.mode == 'open_check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull latest to get nightly outputs
          ref: main

      - name: Lateness guard
        id: late
        run: |
          NOW_HM=$(TZ=Asia/Shanghai date +%H%M)
          if [ $((10#$NOW_HM)) -gt 1030 ]; then
            echo "late=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Open check started at ${NOW_HM} Shanghai (past 10:30). A GO/CANCEL verdict is no longer actionable at the open — skipping."
          else
            echo "late=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest watchlist
        id: check
        if: steps.late.outputs.late != 'true'
        run: |
          TRADE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          WL_FILE="outputs/${TRADE_DATE}/execution_watchlist_${TRADE_DATE}.json"
          if [ -f "${WL_FILE}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
            echo "Same-day watchlist found: ${WL_FILE}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
            echo "ERROR: Missing same-day watchlist ${WL_FILE}. The 07:15 pre-open scan must finish and commit before the 09:35 open check."
            exit 1
          fi

      - name: Set up Python
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning check
        if: steps.check.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_TELEGRAM_LOG_URL: ${{ secrets.MAS_TELEGRAM_LOG_URL }}
          MAS_API_SECRET_KEY: ${{ secrets.MAS_API_SECRET_KEY }}
        run: |
          TRADE_DATE="${{ steps.check.outputs.trade_date }}"
          python scripts/morning_check.py --date "${TRADE_DATE}"

      - name: Commit check results
        if: steps.check.outputs.found == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TRADE_DATE="${{ steps.check.outputs.trade_date }}"
          git add "outputs/${TRADE_DATE}/execution_check_${TRADE_DATE}.json" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.morning_alert_sent" 2>/dev/null || true
          git add "outputs/${TRADE_DATE}/.morning_open_pending_sent" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No check results to commit"
          else
            git commit -m "auto: CN morning check for ${TRADE_DATE}"
            scripts/gha_push_with_rebase.sh main 3
          fi
