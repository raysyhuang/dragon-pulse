# Dragon Pulse — Deterministic A-Share Scanner Configuration
# Two engines: mean_reversion + sniper, top 1000 by market cap

market:
  region: "CN"
  timezone: "Asia/Shanghai"
  close_hour_local: 15
  close_minute_local: 0

data:
  provider: "AUTO"
  china:
    # Authenticated, canonical source for CN scanner and research artifacts.
    # AkShare is an explicitly degraded fallback only.
    primary: "tushare"
    backup: "akshare"
    adjust: "qfq"
    tushare_token_env: "TUSHARE_TOKEN"
  us:
    provider: "yahoo"

universe:
  mode: "CHINA_A"
  cache_file: "universe_cache_CHINA_A.csv"
  cache_max_age_days: 7
  exclude_st: true
  exclude_delisting_warning: true
  exclude_star_market: true  # Ray/IBKR cannot trade 688xxx.SH; fail closed in scan and replay

# Required by config validator (legacy compat)
liquidity:
  min_price: 5.0
  min_avg_dollar_volume_20d: 50000000
  min_avg_volume: 1000000

technicals:
  rsi_period: 14
  ma_windows: [10, 20, 50]
  atr_period: 14
  lookback_days: 300

# =============================================================================
# MEAN REVERSION ENGINE — RSI(2) oversold bounces
# =============================================================================
# Active in ALL regimes (bull, choppy, bear)
mean_reversion:
  enabled: false  # replaced by bull-gated RS Pullback alpha core; keep code for research/fallback
  # Weights (must sum to 1.0)
  w_rsi2: 0.40
  w_trend: 0.25
  w_streak: 0.15
  w_proximity: 0.10
  w_volume: 0.10

  # Gates
  min_bars: 60
  adv_min_cny: 50000000        # 50M CNY floor
  max_single_day_move: 0.11    # reject split/bad-data artifacts
  rsi2_max: 10                 # RSI(2) oversold trigger
  score_floor: 65              # min composite to emit signal

  # Targets
  stop_atr_mult: 0.95
  target_1_atr_mult: 1.5
  target_2_atr_mult: 2.0
  max_entry_atr_mult: 0.1
  holding_period: 3
  subtype_split:
    enabled: true
    rsi2_bounce_max: 3.0
    streak_bounce_max: -3
    dist_from_5d_low_bounce_max: 0.75
    drift:
      stop_atr_mult: 1.0
      target_1_atr_mult: 1.25
      target_2_atr_mult: 2.0
      max_entry_atr_mult: 0.1
      holding_period: 4

  # Regime
  regime:
    csi300_symbol: "000300.SH"
    sma_short: 20
    sma_long: 50

# =============================================================================
# SNIPER ENGINE — BB squeeze + volume compression breakouts
# =============================================================================
# Bear regime → hard block. Score floors: 60 bull, 65 choppy
sniper:
  enabled: false  # quarantined — 21% win rate, -0.42% exp across all tests
  # Weights (must sum to 1.0)
  w_bb_squeeze: 0.30
  w_vol_compression: 0.25
  w_relative_strength: 0.20
  w_trend: 0.15
  w_momentum: 0.10

  # Hard gates
  atr_pct_floor: 3.5
  min_avg_volume: 1000000      # 1M shares floor
  bear_block: true

  # Score floors per regime
  score_floor_bull: 65
  score_floor_choppy: 70

  # Targets
  stop_atr_mult: 2.0
  target_atr_mult: 3.0
  target_2_atr_mult: 5.0
  max_entry_pct: 0.02          # A-share MAS-style no-chase ceiling (entry × 1.02)
  holding_period: 7

  regime:
    csi300_symbol: "000300.SH"

# =============================================================================
# RS PULLBACK ALPHA CORE — bull+choppy paper/daily core; bear remains blocked
# =============================================================================
alpha_candidates:
  enabled: true
  engines: ["rs_pullback"]
  rs_pullback:
    enabled: true
    regimes: ["bull", "choppy"]   # paper only; frozen 5Y replay evidence is committed with this gate
    score_floor: 90
    max_entry_pct: 0.02
    min_adv_cny: 80000000
    stop_atr_mult: 1.1
    target_atr_mult: 2.1
    target_2_atr_mult: 3.6
    holding_period: 5
  sniper_breakout:
    enabled: false
    regimes: ["bull"]
    score_floor: 82
    max_entry_pct: 0.03
    min_adv_cny: 120000000
    stop_atr_mult: 1.35
    target_atr_mult: 2.8
    target_2_atr_mult: 4.2
    holding_period: 5
  limitup_continuation:
    enabled: false
    regimes: ["bull"]
    score_floor: 78
    max_entry_pct: 0.02
    min_adv_cny: 80000000
    stop_atr_mult: 1.25
    target_atr_mult: 2.4
    target_2_atr_mult: 3.8
    holding_period: 4
  accumulation_breakout:
    enabled: false
    regimes: ["bull"]
    score_floor: 76
    max_entry_pct: 0.025
    min_adv_cny: 80000000
    stop_atr_mult: 1.2
    target_atr_mult: 2.3
    target_2_atr_mult: 3.6
    holding_period: 5

# =============================================================================
# EXTERNAL PAPER SLEEVES — research manifests only, never live-ranked by scanner
# =============================================================================
external_paper_sleeves:
  enabled: true
  sleeves:
    northbound_active_riskband_paper:
      enabled: true
      source: "tushare.hsgt_top10 + daily OHLCV"
      rule: "parallel paper feed: northbound active rank<=5, conservative T+1 no-chase fill, stop-risk 4-7%, 5D bracket replay"
      status: "parallel_paper_feed_only"
      validation_gate: "Bracket replay passed only as paper lead; still requires PIT/survivorship-clean walk-forward and hsgt_top10 publication-lag confirmation before any promotion"
      promotion_blockers:
        - "Below MAS Sniper benchmark after bracket replay: 51.98% WR / +1.681% avg / PF 1.728 vs ~80% WR / +3.9% avg / PF 3.6"
        - "Needs walk-forward / out-of-sample validation before any production use"
        - "Depends on northbound active endpoint availability and publication lag"
      artifacts:
        summary_csv: "/tmp/dp_alpha_event_search_20260629/northbound_composite/northbound_composite_summary.csv"
        events_csv: "/tmp/dp_alpha_event_search_20260629/northbound_composite/northbound_composite_events.csv"
        bracket_summary_csv: "/tmp/dp_alpha_event_search_20260629/northbound_bracket_replay/northbound_bracket_summary.csv"
        bracket_events_csv: "/tmp/dp_alpha_event_search_20260629/northbound_bracket_replay/northbound_bracket_events.csv"
        note: "references/northbound-active-riskband-paper-2026-06.md"

# =============================================================================
# PORTFOLIO & RISK SETTINGS — Variable Book Size
# =============================================================================
book_size:
  breadth_floor: 0.15  # % of universe above SMA20 to allow any picks
  max_per_sector: 1    # max picks from same industry per day

  # Regime-specific constraints
  bull:
    max_picks: 2
    min_score: 90
  choppy:
    max_picks: 2
    min_score: 90
  bear:
    max_picks: 0
    min_score: 999

# =============================================================================
# ACCEPTANCE LAYER — app-level precision filter above engines
# =============================================================================
acceptance:
  enabled: true
  excluded_regimes: ["bear"]  # bear stays out: -0.17% exp gross, -0.32% at 0.15% round-trip cost
  dq_full_threshold: 55       # day quality ≥ this → full mode (A+B tiers)
  dq_selective_threshold: 20  # day quality ≥ this → selective (A-tier only)
  max_full: 2                 # max picks in full mode
  max_selective: 2            # max picks in selective mode
  # Below dq_selective_threshold → abstain (0 picks)

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================
outputs:
  root: "outputs"
  save_json: true
  save_csv: true

# =============================================================================
# RUNTIME SETTINGS
# =============================================================================
runtime:
  threads: true
  yf_auto_adjust: false
  method_version: "v4.2-rs-pullback-bull-choppy-paper"
  china_trading_days: true
  exclude_suspended: true

# =============================================================================
# CACHE SETTINGS
# =============================================================================
cache:
  enabled: true
  backend: "sqlite"
  sqlite_path: "data/price_cache.db"
  price_ttl_seconds: 3600
  news_ttl_seconds: 1800

# =============================================================================
# ALERTS
# =============================================================================
alerts:
  enabled: true
  channels: ["telegram", "file"]

# =============================================================================
# PREFLIGHT (morning check thresholds)
# =============================================================================
preflight:
  max_gap_up_pct: 3.0
  max_gap_down_pct: 5.0
  min_volume_ratio: 0.10
